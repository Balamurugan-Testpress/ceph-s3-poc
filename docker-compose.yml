services:
  db:
    image: postgres:16-alpine
    container_name: ceph-s3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cephs3
      POSTGRES_PASSWORD: cephs3
      POSTGRES_DB: cephs3
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: ceph-s3-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ceph-s3-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
