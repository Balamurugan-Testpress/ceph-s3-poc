services:
  api:
    build: .
    container_name: ceph-s3-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: ceph-s3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cephs3
      POSTGRES_PASSWORD: cephs3
      POSTGRES_DB: cephs3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ceph-s3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
